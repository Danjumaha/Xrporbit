<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP Ledger | Secure Access</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 3rem;
            width: 100%;
            box-sizing: border-box;
        }
        .eye-toggle {
            position: absolute;
            right: 1.1rem;
            color: var(--text-muted, #9ca3af);
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }
        .eye-toggle:hover {
            color: #00A86B;
        }
        .strength-container {
            margin-top: 0.5rem;
            display: none;
        }
        .strength-bar-wrapper {
            height: 6px;
            width: 100%;
            background-color: var(--border-color, #e5e7eb);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.4rem;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .strength-text {
            font-size: 0.75rem;
            font-weight: 600;            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .error-text {
            color: #E63946;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h1>XRP</h1>
            <p>Crypto Wallet</p>
        </div>

        <div class="auth-tabs">
            <button id="tab-login" class="active">Sign In</button>
            <button id="tab-signup">Register</button>
        </div>

        <form id="auth-form">
            <div class="input-group" id="name-group" style="display: none;">
                <label>Legal Full Name</label>
                <input type="text" id="auth-name" placeholder="Alexander Wright">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="auth-email" placeholder="name@luxury-ledger.com" required>
            </div>
            
            <div class="input-group">
                <label>Secure Password</label>
                <div class="password-wrapper">
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye eye-toggle" id="toggle-password"></i>
                </div>
                <div class="strength-container" id="strength-container">
                    <div class="strength-bar-wrapper">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <span class="strength-text" id="strength-text"></span>
                </div>
            </div>

            <div class="input-group" id="confirm-password-group" style="display: none;">
                <label>Confirm Secure Password</label>                <div class="password-wrapper">
                    <input type="password" id="auth-confirm-password" placeholder="••••••••">
                    <i class="fa-regular fa-eye eye-toggle" id="toggle-confirm-password"></i>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">Access Environment</button>
        </form>
        <p id="error-message" class="error-text"></p>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL, createUserWithEmailAndPassword, signInWithEmailAndPassword, doc, setDoc, getDoc, signOut } from './app.js';

        const form = document.getElementById('auth-form');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const nameGroup = document.getElementById('name-group');
        const confirmPasswordGroup = document.getElementById('confirm-password-group');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        
        const passwordInput = document.getElementById('auth-password');
        const confirmPasswordInput = document.getElementById('auth-confirm-password');
        const togglePassword = document.getElementById('toggle-password');
        const toggleConfirmPassword = document.getElementById('toggle-confirm-password');
        const strengthContainer = document.getElementById('strength-container');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');

        let isLoginMode = true;

        function handleCleanErrorMessage(error) {
            const code = error.code || error.message || "";
            console.error("Auth Error:", error);

            if (code.includes('email-already-in-use')) {
                return "This email address is already registered.";
            } else if (code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-credential')) {
                return "Access Denied. Invalid credentials.";
            } else if (code.includes('weak-password')) {
                return "Password must be at least 6 characters long.";
            } else if (code.includes('invalid-email')) {
                return "Invalid email format.";
            } else if (code.includes('permission-denied') || code.includes('insufficient-permissions')) {
                return "Database Error. Check Firestore Security Rules.";
            } else if (code.includes('network-request-failed')) {
                return "Network error. Check your connection.";
            }
                        return "An unexpected error occurred.";
        }

        tabLogin.addEventListener('click', () => {
            isLoginMode = true;
            errorMsg.innerText = "";
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            nameGroup.style.display = 'none';
            confirmPasswordGroup.style.display = 'none';
            confirmPasswordInput.removeAttribute('required');
            strengthContainer.style.display = 'none';
            submitBtn.innerText = 'Access Environment';
        });

        tabSignup.addEventListener('click', () => {
            isLoginMode = false;
            errorMsg.innerText = "";
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            nameGroup.style.display = 'block';
            confirmPasswordGroup.style.display = 'block';
            confirmPasswordInput.setAttribute('required', 'true');
            strengthContainer.style.display = 'block';
            submitBtn.innerText = 'Establish New Ledger';
        });

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        toggleConfirmPassword.addEventListener('click', () => {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            toggleConfirmPassword.classList.toggle('fa-eye');
            toggleConfirmPassword.classList.toggle('fa-eye-slash');
        });

        passwordInput.addEventListener('input', () => {
            if (isLoginMode) return;
            const pass = passwordInput.value;
            let score = 0;

            if (!pass) {
                strengthBar.style.width = '0%';
                strengthText.innerText = '';
                return;            }

            if (pass.length >= 6) score++;
            if (pass.length >= 10) score++;
            if (/[A-Z]/.test(pass)) score++;
            if (/[0-9]/.test(pass)) score++;
            if (/[^A-Za-z0-9]/.test(pass)) score++;

            if (score <= 2) {
                strengthBar.style.width = '33%';
                strengthBar.style.backgroundColor = '#E63946';
                strengthText.innerText = 'Weak';
                strengthText.style.color = '#E63946';
            } else if (score === 3 || score === 4) {
                strengthBar.style.width = '66%';
                strengthBar.style.backgroundColor = '#3A86FF';
                strengthText.innerText = 'Good';
                strengthText.style.color = '#3A86FF';
            } else if (score >= 5) {
                strengthBar.style.width = '100%';
                strengthBar.style.backgroundColor = '#00A86B';
                strengthText.innerText = 'Strong';
                strengthText.style.color = '#00A86B';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.innerText = "";
            
            const email = document.getElementById('auth-email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const name = document.getElementById('auth-name').value.trim();

            if (!isLoginMode && password !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match.";
                return;
            }

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    if (user.email === ADMIN_EMAIL) {
                        window.location.href = 'admin.html';
                        return;
                    }
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().isPaused) {
                        await signOut(auth);
                        errorMsg.innerText = "Account suspended by admin.";
                        return;
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        name: name || "Premium Investor",
                        email: email,
                        balance: 0,
                        isPaused: false,
                        tier: "Tier 1 (Basic Access)",
                        verificationStatus: "Unverified",
                        depositPercentage: 5,
                        depositHistory: [],
                        createdDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
                    });

                    if (email === ADMIN_EMAIL) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (error) {
                errorMsg.innerText = handleCleanErrorMessage(error);
            }
        });
    </script>
</body>
</html>
